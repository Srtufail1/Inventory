<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#146c66" />
    <title>Offline | ZamZam Cold Storage</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #f8fafc;
        color: #0f172a;
      }
      main {
        max-width: 380px;
        text-align: center;
      }
      img {
        width: 96px;
        height: 96px;
        margin-bottom: 20px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 20px;
        font-weight: 600;
      }
      p {
        margin: 0 0 24px;
        font-size: 15px;
        line-height: 1.5;
        color: #475569;
      }
      button {
        border: 0;
        border-radius: 8px;
        padding: 12px 24px;
        font-size: 15px;
        font-weight: 500;
        color: #fff;
        background: #146c66;
        cursor: pointer;
      }
      button:active {
        opacity: 0.85;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #0f172a;
          color: #f1f5f9;
        }
        p {
          color: #94a3b8;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="ZamZam Cold Storage" />
      <h1>You're offline</h1>
      <p>
        ZamZam Cold Storage needs a connection to load your inventory data. Check your network and
        try again.
      </p>
      <button type="button" onclick="location.reload()">Retry</button>
    </main>
  </body>
</html>
